services:
  faircom-edge:
    image: faircomteam/edge:latest
    container_name: faircom-edge
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9001:9001"
      - "1883:1883"
      - "6597:6597"
    volumes:
      - faircom-edge-data:/opt/faircom/data

  faircom-mcp:
    image: faircomteam/faircom-mcp:latest
    container_name: faircom-mcp
    restart: unless-stopped
    depends_on:
      faircom-edge:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      FAIRCOM_API_BASE_URL: http://faircom-edge:8080/api
      FAIRCOM_API_USERNAME: ${FAIRCOM_API_USERNAME:-ADMIN}
      FAIRCOM_API_PASSWORD: ${FAIRCOM_API_PASSWORD:-ADMIN}
      FAIRCOM_HTTP_HOST: 0.0.0.0
      FAIRCOM_HTTP_PORT: 8000
    command: ["--transport", "http"]

  modbus-sim:
    image: python:3.12-alpine
    container_name: modbus-sim
    restart: unless-stopped
    profiles:
      - modbus-sim
    ports:
      - "1502:1502"
    volumes:
      - ./modbus-sim:/app:ro
    command:
      - sh
      - -c
      - pip install --no-cache-dir pymodbus==3.8.3 && python /app/modbus_telemetry_simulator.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.socket(); s.settimeout(1); s.connect(("127.0.0.1", 1502)); s.close()
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

volumes:
  faircom-edge-data:
